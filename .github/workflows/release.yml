name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          node --check internal/manager/web/assets/app.js

      - name: Get version
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build Manager - Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X merit/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }} \
            -X merit/internal/buildinfo.Commit=${{ steps.version.outputs.COMMIT_HASH }} \
            -X merit/internal/buildinfo.BuildTime=${{ steps.version.outputs.BUILD_TIME }}" \
            -o dist/merit-manager-linux-amd64 \
            ./cmd/manager

      - name: Build Manager - Linux ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X merit/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }} \
            -X merit/internal/buildinfo.Commit=${{ steps.version.outputs.COMMIT_HASH }} \
            -X merit/internal/buildinfo.BuildTime=${{ steps.version.outputs.BUILD_TIME }}" \
            -o dist/merit-manager-linux-arm64 \
            ./cmd/manager

      - name: Build Manager - Windows AMD64
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X merit/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }} \
            -X merit/internal/buildinfo.Commit=${{ steps.version.outputs.COMMIT_HASH }} \
            -X merit/internal/buildinfo.BuildTime=${{ steps.version.outputs.BUILD_TIME }}" \
            -o dist/merit-manager-windows-amd64.exe \
            ./cmd/manager

      - name: Build Manager - macOS AMD64
        run: |
          GOOS=darwin GOARCH=amd64 go build \
            -ldflags="-s -w -X merit/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }} \
            -X merit/internal/buildinfo.Commit=${{ steps.version.outputs.COMMIT_HASH }} \
            -X merit/internal/buildinfo.BuildTime=${{ steps.version.outputs.BUILD_TIME }}" \
            -o dist/merit-manager-darwin-amd64 \
            ./cmd/manager

      - name: Build Manager - macOS ARM64
        run: |
          GOOS=darwin GOARCH=arm64 go build \
            -ldflags="-s -w -X merit/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }} \
            -X merit/internal/buildinfo.Commit=${{ steps.version.outputs.COMMIT_HASH }} \
            -X merit/internal/buildinfo.BuildTime=${{ steps.version.outputs.BUILD_TIME }}" \
            -o dist/merit-manager-darwin-arm64 \
            ./cmd/manager

      - name: Build Agent - Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X merit/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }} \
            -X merit/internal/buildinfo.Commit=${{ steps.version.outputs.COMMIT_HASH }} \
            -X merit/internal/buildinfo.BuildTime=${{ steps.version.outputs.BUILD_TIME }}" \
            -o dist/merit-agent-linux-amd64 \
            ./cmd/agent

      - name: Build Agent - Linux ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X merit/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }} \
            -X merit/internal/buildinfo.Commit=${{ steps.version.outputs.COMMIT_HASH }} \
            -X merit/internal/buildinfo.BuildTime=${{ steps.version.outputs.BUILD_TIME }}" \
            -o dist/merit-agent-linux-arm64 \
            ./cmd/agent

      - name: Calculate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT_HASH: ${{ steps.version.outputs.COMMIT_HASH }}
          BUILD_TIME: ${{ steps.version.outputs.BUILD_TIME }}
        run: |
          notes="docs/RELEASE_NOTES_${VERSION}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release_notes.md
          else
            printf '## UnifiedProxy %s\n\nSee README.md for installation and upgrade instructions.\n' "$VERSION" > release_notes.md
          fi
          printf '\n\nBuild: %s / %s / %s\n' "$VERSION" "$COMMIT_HASH" "$BUILD_TIME" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/merit-manager-linux-amd64
            dist/merit-manager-linux-arm64
            dist/merit-manager-windows-amd64.exe
            dist/merit-manager-darwin-amd64
            dist/merit-manager-darwin-arm64
            dist/merit-agent-linux-amd64
            dist/merit-agent-linux-arm64
            dist/SHA256SUMS
          body_path: release_notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
